[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "permitprobe"
version = "0.2.0"
description = "Contract-driven website, API, data, and AI handoff security regression checks"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
maintainers = [{name = "Susan (@Chorolee)"}]
keywords = ["security", "authorization", "api-security", "security-testing", "web-security"]
dependencies = [
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "overstep==1.5.0",
  "pydantic>=2.10,<3",
]

[project.urls]
Repository = "https://github.com/Chorolee/permitprobe"
Issues = "https://github.com/Chorolee/permitprobe/issues"
Releases = "https://github.com/Chorolee/permitprobe/releases"
Security = "https://github.com/Chorolee/permitprobe/security/policy"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "build>=1.2,<2", "twine>=6,<7"]

[project.scripts]
permitprobe = "permitprobe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
