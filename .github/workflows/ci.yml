name: Boundary regression tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -c requirements.lock -e '.[dev]'
      - run: python scripts/install_gitleaks.py
      - run: ruff check src tests scripts
      - run: python -m pytest -q
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Install and smoke-test the built wheel
        run: >-
          python scripts/smoke_wheel.py
          --wheel dist/permitprobe-0.3.0-py3-none-any.whl
          --constraint requirements.lock
          --gitleaks .tools/gitleaks
