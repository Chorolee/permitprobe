name: Boundary regression tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -c requirements.lock -e '.[dev]'
      - run: python scripts/install_gitleaks.py
      - run: ruff check src tests scripts
      - run: python -m pytest -q
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Install and smoke-test the built wheel
        run: >-
          python scripts/smoke_wheel.py
          --wheel dist/permitprobe-0.2.1-py3-none-any.whl
          --constraint requirements.lock
          --gitleaks .tools/gitleaks
