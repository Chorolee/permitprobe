name: Boundary regression tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python scripts/install_gitleaks.py
      - name: Scan the checked-out source for secrets
        if: matrix.python-version == '3.14'
        env:
          GITLEAKS_CONFIG_TOML: |
            [extend]
            useDefault = true
        run: >-
          .tools/gitleaks dir .
          --gitleaks-ignore-path /dev/null
          --ignore-gitleaks-allow
          --no-banner
          --redact
      - name: Install hash-locked dependencies
        run: >-
          python -m pip install
          --require-hashes
          --only-binary=:all:
          -r requirements.lock
      - name: Install PermitProbe without dependency resolution
        run: python -m pip install --no-deps -e .
      - run: ruff check src tests scripts
      - run: python -m pytest -q
      - run: python -m build --no-isolation
      - run: python -m twine check --strict dist/*
      - name: Install and smoke-test the built wheel
        run: >-
          python scripts/smoke_wheel.py
          --wheel dist/permitprobe-0.3.2-py3-none-any.whl
          --requirements requirements.lock
          --gitleaks .tools/gitleaks
