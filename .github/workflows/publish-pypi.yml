name: Publish verified release to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published GitHub release tag
        required: true
        default: v0.3.0
        type: string
      publish:
        description: Upload to PyPI (false validates the release without uploading)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pypi-publication
  cancel-in-progress: false

jobs:
  verify:
    name: Verify released distributions
    if: github.repository == 'Chorolee/permitprobe' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate release tag input
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python -c 'import os,re,sys; sys.exit(0 if re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+",os.environ["RELEASE_TAG"]) else 2)'
      - name: Check out the trusted verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: verifier
          persist-credentials: false
      - name: Check out the requested release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          path: release-source
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install metadata validation tooling
        run: >-
          python -m pip install
          --require-hashes
          --only-binary=:all:
          -r verifier/requirements.lock
      - name: Download and verify published distribution bytes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh api "repos/Chorolee/permitprobe/releases/tags/$RELEASE_TAG" > release.json
          gh release download "$RELEASE_TAG" --repo Chorolee/permitprobe --dir dist --pattern 'permitprobe-*.whl' --pattern 'permitprobe-*.tar.gz'
          python verifier/scripts/verify_release.py --metadata release.json --dist dist --tag "$RELEASE_TAG" --source-root release-source
          python -m twine check --strict dist/*
      - name: Install the pinned handoff scanner
        run: python verifier/scripts/install_gitleaks.py --output "$RUNNER_TEMP/gitleaks"
      - name: Smoke-test the published wheel
        run: >-
          python verifier/scripts/smoke_wheel.py
          --wheel dist/permitprobe-*-py3-none-any.whl
          --requirements verifier/requirements.lock
          --gitleaks "$RUNNER_TEMP/gitleaks"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish verified distributions
    if: inputs.publish
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/permitprobe/
    permissions:
      id-token: write # Exchange GitHub OIDC identity with the PyPI Trusted Publisher.
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-distributions
          path: dist/
      - name: Publish through the registered PyPI Trusted Publisher
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
          attestations: true
